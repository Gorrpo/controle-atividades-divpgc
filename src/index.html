<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DIVPGC — Controle de Atividades</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; color: #333; }

    header {
      background: #1a73e8; color: #fff; padding: 16px 24px;
      display: flex; align-items: center; justify-content: space-between;
    }
    header h1 { font-size: 1.2rem; font-weight: 600; }
    header button {
      background: #fff; color: #1a73e8; border: none; border-radius: 6px;
      padding: 8px 16px; font-weight: 600; cursor: pointer; font-size: 0.9rem;
    }

    .container { max-width: 1200px; margin: 24px auto; padding: 0 16px; }

    /* Cards de resumo */
    .cards { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 24px; }
    .card {
      flex: 1; min-width: 130px; background: #fff; border-radius: 10px;
      padding: 16px; text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,.1);
    }
    .card .num { font-size: 2rem; font-weight: 700; }
    .card .label { font-size: 0.75rem; color: #666; margin-top: 4px; }
    .card.amarelo .num { color: #f59e0b; }
    .card.verde   .num { color: #22c55e; }
    .card.azul    .num { color: #3b82f6; }
    .card.cinza   .num { color: #6b7280; }
    .card.vermelho .num { color: #ef4444; }

    /* Filtros */
    .filtros {
      background: #fff; border-radius: 10px; padding: 16px;
      display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px;
      box-shadow: 0 1px 4px rgba(0,0,0,.1);
    }
    .filtros input, .filtros select {
      border: 1px solid #ddd; border-radius: 6px; padding: 8px 12px;
      font-size: 0.9rem; flex: 1; min-width: 160px;
    }

    /* Tabela */
    .tabela-wrap {
      background: #fff; border-radius: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,.1); overflow: hidden;
    }
    table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    thead th {
      background: #1a73e8; color: #fff; padding: 12px 10px;
      text-align: left; font-weight: 600; white-space: nowrap;
    }
    tbody tr { border-bottom: 1px solid #f0f0f0; transition: background .15s; }
    tbody tr:hover { background: #f8faff; }
    tbody td { padding: 10px; vertical-align: middle; }

    .badge {
      display: inline-block; border-radius: 12px; padding: 3px 10px;
      font-size: 0.78rem; font-weight: 600; white-space: nowrap;
    }
    .badge-Concluída     { background: #dcfce7; color: #166534; }
    .badge-Em-Andamento  { background: #dbeafe; color: #1e40af; }
    .badge-Aguardando    { background: #fef9c3; color: #854d0e; }
    .badge-Não-Iniciada  { background: #f3f4f6; color: #374151; }
    .badge-Arquivada     { background: #f3f4f6; color: #9ca3af; }

    .btn-acao {
      background: none; border: none; cursor: pointer; font-size: 1rem;
      padding: 4px 6px; border-radius: 4px;
    }
    .btn-acao:hover { background: #f0f0f0; }

    /* Modal */
    .overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.45); z-index: 100; align-items: center; justify-content: center;
    }
    .overlay.ativo { display: flex; }
    .modal {
      background: #fff; border-radius: 12px; padding: 28px;
      width: 100%; max-width: 640px; max-height: 90vh; overflow-y: auto;
      box-shadow: 0 8px 32px rgba(0,0,0,.2);
    }
    .modal h2 { font-size: 1.1rem; margin-bottom: 20px; color: #1a73e8; }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .form-grid .full { grid-column: 1 / -1; }
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-group label { font-size: 0.82rem; font-weight: 600; color: #555; }
    .form-group input, .form-group select, .form-group textarea {
      border: 1px solid #ddd; border-radius: 6px; padding: 9px 12px;
      font-size: 0.9rem; font-family: inherit;
    }
    .form-group textarea { resize: vertical; min-height: 70px; }

    .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
    .btn-cancelar {
      background: #f3f4f6; border: none; border-radius: 6px;
      padding: 10px 20px; cursor: pointer; font-size: 0.9rem;
    }
    .btn-salvar {
      background: #1a73e8; color: #fff; border: none; border-radius: 6px;
      padding: 10px 20px; cursor: pointer; font-weight: 600; font-size: 0.9rem;
    }
    .btn-salvar:disabled { opacity: .6; cursor: not-allowed; }

    .vencido { color: #ef4444; font-weight: 600; }
    .proximo { color: #f59e0b; font-weight: 600; }

    #loading { text-align: center; padding: 48px; color: #888; }
    .empty { text-align: center; padding: 40px; color: #aaa; }
  </style>
</head>
<body>

<header>
  <h1>DIVPGC — Controle de Atividades</h1>
  <button onclick="abrirModal()">+ Nova Atividade</button>
</header>

<div class="container">
  <div class="cards" id="cards"></div>

  <div class="filtros">
    <input type="text" id="filtroTexto" placeholder="Buscar por descrição ou responsável..." oninput="filtrar()">
    <select id="filtroStatus" onchange="filtrar()">
      <option value="">Todos os status</option>
    </select>
    <select id="filtroTipo" onchange="filtrar()">
      <option value="">Todos os tipos</option>
    </select>
  </div>

  <div class="tabela-wrap">
    <div id="loading">Carregando atividades...</div>
    <table id="tabela" style="display:none">
      <thead>
        <tr>
          <th>ID</th>
          <th>Descrição</th>
          <th>Tipo</th>
          <th>Responsável</th>
          <th>Status</th>
          <th>Prazo</th>
          <th>Setor Externo</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="corpo"></tbody>
    </table>
    <div id="vazio" class="empty" style="display:none">Nenhuma atividade encontrada.</div>
  </div>
</div>

<!-- Modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitulo">Nova Atividade</h2>
    <div class="form-grid">
      <div class="form-group">
        <label>ID (gerado automaticamente se vazio)</label>
        <input type="text" id="fId" placeholder="DIV-001">
      </div>
      <div class="form-group">
        <label>Data de Abertura</label>
        <input type="date" id="fDataAbertura">
      </div>
      <div class="form-group full">
        <label>Descrição / Título *</label>
        <input type="text" id="fDescricao" placeholder="Descreva a atividade">
      </div>
      <div class="form-group">
        <label>Tipo *</label>
        <select id="fTipo"></select>
      </div>
      <div class="form-group">
        <label>Status *</label>
        <select id="fStatus"></select>
      </div>
      <div class="form-group">
        <label>Responsável Interno</label>
        <input type="text" id="fResponsavel" placeholder="Nome do servidor">
      </div>
      <div class="form-group">
        <label>Setor Externo Dependente</label>
        <input type="text" id="fSetorExterno" placeholder="Ex: Procuradoria, PPG, CAPES">
      </div>
      <div class="form-group">
        <label>Prazo / Previsão</label>
        <input type="date" id="fPrazo">
      </div>
      <div class="form-group">
        <label>Data de Conclusão</label>
        <input type="date" id="fDataConclusao">
      </div>
      <div class="form-group full">
        <label>Observações</label>
        <textarea id="fObservacoes" placeholder="Informações adicionais..."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancelar" onclick="fecharModal()">Cancelar</button>
      <button class="btn-salvar" id="btnSalvar" onclick="salvar()">Salvar</button>
    </div>
  </div>
</div>

<script>
  var ATIVIDADES = [];
  var LINHA_EDICAO = null;
  var CONFIG = {};

  function init() {
    google.script.run
      .withSuccessHandler(function(cfg) {
        CONFIG = cfg;
        _popularSelects();
        carregarAtividades();
      })
      .getConfig();
  }

  function _popularSelects() {
    var selStatus = document.getElementById('filtroStatus');
    var selTipo   = document.getElementById('filtroTipo');
    var fStatus   = document.getElementById('fStatus');
    var fTipo     = document.getElementById('fTipo');

    CONFIG.statusValidos.forEach(function(s) {
      selStatus.innerHTML += '<option value="' + s + '">' + s + '</option>';
      fStatus.innerHTML   += '<option value="' + s + '">' + s + '</option>';
    });
    CONFIG.tiposValidos.forEach(function(t) {
      selTipo.innerHTML += '<option value="' + t + '">' + t + '</option>';
      fTipo.innerHTML   += '<option value="' + t + '">' + t + '</option>';
    });
  }

  function carregarAtividades() {
    google.script.run
      .withSuccessHandler(function(lista) {
        ATIVIDADES = lista;
        renderizar(lista);
      })
      .listarAtividades();
  }

  function renderizar(lista) {
    document.getElementById('loading').style.display = 'none';

    // Cards
    var contadores = {};
    CONFIG.statusValidos.forEach(function(s) { contadores[s] = 0; });
    lista.forEach(function(a) { if (contadores[a.status] !== undefined) contadores[a.status]++; });

    var cores = {
      'Não Iniciada': 'cinza', 'Em Andamento': 'azul',
      'Aguardando': 'amarelo', 'Concluída': 'verde', 'Arquivada': 'cinza'
    };
    document.getElementById('cards').innerHTML =
      '<div class="card azul"><div class="num">' + lista.length + '</div><div class="label">Total</div></div>' +
      CONFIG.statusValidos.map(function(s) {
        return '<div class="card ' + (cores[s] || '') + '"><div class="num">' + contadores[s] +
               '</div><div class="label">' + s + '</div></div>';
      }).join('');

    // Tabela
    if (lista.length === 0) {
      document.getElementById('tabela').style.display = 'none';
      document.getElementById('vazio').style.display  = 'block';
      return;
    }
    document.getElementById('tabela').style.display = '';
    document.getElementById('vazio').style.display  = 'none';

    var hoje = new Date(); hoje.setHours(0,0,0,0);
    document.getElementById('corpo').innerHTML = lista.map(function(a) {
      var badgeClass = 'badge badge-' + (a.status || '').replace(/\s/g, '-').replace(/[ã]/g, 'a').replace(/[í]/g, 'i');
      var prazoHtml = '';
      if (a.prazo) {
        var dp = new Date(a.prazo + 'T00:00:00');
        var diff = Math.floor((dp - hoje) / 86400000);
        var cls = diff < 0 ? 'vencido' : (diff <= 7 ? 'proximo' : '');
        var txt = diff < 0 ? 'Vencido (' + Math.abs(diff) + 'd)' : (diff === 0 ? 'Hoje' : _fmtBr(a.prazo));
        prazoHtml = '<span class="' + cls + '">' + txt + '</span>';
      }
      return '<tr>' +
        '<td><strong>' + (a.id || '—') + '</strong></td>' +
        '<td>' + a.descricao + '</td>' +
        '<td>' + (a.tipo || '—') + '</td>' +
        '<td>' + (a.responsavel || '—') + '</td>' +
        '<td><span class="' + badgeClass + '">' + (a.status || '—') + '</span></td>' +
        '<td>' + (prazoHtml || '—') + '</td>' +
        '<td>' + (a.setorExterno || '—') + '</td>' +
        '<td>' +
          '<button class="btn-acao" title="Editar" onclick="editar(' + a.linha + ')">✏️</button>' +
          '<button class="btn-acao" title="Excluir" onclick="excluir(' + a.linha + ', \'' + a.descricao.replace(/'/g,'') + '\')">🗑️</button>' +
        '</td>' +
      '</tr>';
    }).join('');
  }

  function filtrar() {
    var texto  = document.getElementById('filtroTexto').value.toLowerCase();
    var status = document.getElementById('filtroStatus').value;
    var tipo   = document.getElementById('filtroTipo').value;

    var filtrado = ATIVIDADES.filter(function(a) {
      return (!texto  || a.descricao.toLowerCase().includes(texto) || (a.responsavel || '').toLowerCase().includes(texto)) &&
             (!status || a.status === status) &&
             (!tipo   || a.tipo   === tipo);
    });
    renderizar(filtrado);
  }

  function abrirModal(dados, linha) {
    LINHA_EDICAO = linha || null;
    document.getElementById('modalTitulo').textContent = linha ? 'Editar Atividade' : 'Nova Atividade';
    document.getElementById('fId').value            = dados ? dados.id            : '';
    document.getElementById('fDataAbertura').value  = dados ? dados.dataAbertura  : _hoje();
    document.getElementById('fDescricao').value     = dados ? dados.descricao     : '';
    document.getElementById('fTipo').value          = dados ? dados.tipo          : CONFIG.tiposValidos[0];
    document.getElementById('fStatus').value        = dados ? dados.status        : CONFIG.statusValidos[0];
    document.getElementById('fResponsavel').value   = dados ? dados.responsavel   : '';
    document.getElementById('fSetorExterno').value  = dados ? dados.setorExterno  : '';
    document.getElementById('fPrazo').value         = dados ? dados.prazo         : '';
    document.getElementById('fDataConclusao').value = dados ? dados.dataConclusao : '';
    document.getElementById('fObservacoes').value   = dados ? dados.observacoes   : '';
    document.getElementById('overlay').classList.add('ativo');
  }

  function fecharModal() {
    document.getElementById('overlay').classList.remove('ativo');
  }

  function editar(linha) {
    var a = ATIVIDADES.find(function(x) { return x.linha === linha; });
    if (a) abrirModal(a, linha);
  }

  function excluir(linha, desc) {
    if (!confirm('Excluir "' + desc + '"?')) return;
    google.script.run
      .withSuccessHandler(function() { carregarAtividades(); })
      .excluirAtividade(linha);
  }

  function salvar() {
    var descricao = document.getElementById('fDescricao').value.trim();
    if (!descricao) { alert('Descrição é obrigatória.'); return; }

    var btn = document.getElementById('btnSalvar');
    btn.disabled = true;
    btn.textContent = 'Salvando...';

    var dados = {
      linhaEdicao:   LINHA_EDICAO,
      id:            document.getElementById('fId').value.trim(),
      dataAbertura:  document.getElementById('fDataAbertura').value,
      descricao:     descricao,
      tipo:          document.getElementById('fTipo').value,
      responsavel:   document.getElementById('fResponsavel').value.trim(),
      setorExterno:  document.getElementById('fSetorExterno').value.trim(),
      status:        document.getElementById('fStatus').value,
      prazo:         document.getElementById('fPrazo').value,
      dataConclusao: document.getElementById('fDataConclusao').value,
      observacoes:   document.getElementById('fObservacoes').value.trim()
    };

    google.script.run
      .withSuccessHandler(function(res) {
        btn.disabled = false;
        btn.textContent = 'Salvar';
        if (res.ok) {
          fecharModal();
          carregarAtividades();
        } else {
          alert('Erro: ' + res.msg);
        }
      })
      .salvarAtividade(dados);
  }

  function _hoje() {
    return new Date().toISOString().slice(0, 10);
  }

  function _fmtBr(iso) {
    if (!iso) return '';
    var p = iso.split('-');
    return p[2] + '/' + p[1] + '/' + p[0];
  }

  document.getElementById('overlay').addEventListener('click', function(e) {
    if (e.target === this) fecharModal();
  });

  init();
</script>
</body>
</html>
